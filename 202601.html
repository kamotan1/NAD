<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>チラシ送付フォーム　2026年1月</title>
  <link rel="stylesheet" href="202601.css">
</head>
<body>

<div id="mainwrapper">
  <h1>チラシ送付フォーム　2026年1月</h1>
  <p>チラシの送り先住所と枚数を教えてください。1/27ごろ発送予定です。</p>

<form action="https://docs.google.com/forms/u/0/d/e/1FAIpQLSdDa2hcdmUvAbyHYh8lQhUh9aw76ZRuPXNpciUb84a_AwxFKw/formResponse" method="POST" target="hidden_iframe" onsubmit="submitted=true;">
  <h3>送り先住所</h3>
    <p>
      <label for="yubinbangou">　〒</label>
      <input type="text" name="entry.1653620495" id="yubin" placeholder="例:1638001" onkeyup="inputCheck ()" required>
    </p>
    <p>
      <button class="form-btn" type="button" onclick="searchAddress ()">住所検索</button>
      <spam id="check" ></spam>
    </p>
    <p>
      住所<input type="text" name="entry.607504945" id="jusho" required>
    </p>
    <p>
      番地<input type="text" name="entry.835690247" id="banchi" required>
    </p>
    <p>
      宛名<input type="text" name="entry.1066054184" id="atena" required>
    </p>
    <h3>チラシ枚数</h3>
    <p><small>ざっくり教えてください。適宜調整させていただきます。</small></p>
    <p><input type="text" name="entry.1508545114" id="maisuu" required>　枚</p>
    <p><button class="form-btn" type="submit" name="submit" value="送信">送 信</button></p>
</form>

</div>

<script>
  async function searchAddress () {
    const postalCode = document.getElementById("yubin").value;
    const url = 'https://zipcloud.ibsnet.co.jp/api/search?zipcode=' + postalCode;
    const response = await fetch(url);
    const data = await response.json();
    if(!(data['results'])) {
      document.getElementById( "check" ).innerHTML = '該当データなし';
    } else {
      const address = data['results'][0]['address1'] + data['results'][0]['address2'] + data['results'][0]['address3']
      document.getElementById( "jusho" ).value = address;
    }
  }

  function inputCheck() {
    const inputValue = document.getElementById( "yubin" ).value;
    if (!(inputValue.match(/^[0-9]+$/)) || !(inputValue.length === 7)) {
      document.getElementById( "check" ).innerHTML = '半角数字7桁で入力してください';
    } else {
      document.getElementById( "check" ).innerHTML = '';
    }
  }

  <!--
  function dummyPost () {
    alert('送信はしないぜ')
  }
-->
</script>
</body>
</html>
